<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Inspection Dashboard</title><link rel="stylesheet" href="dist/main.css"><script>try{var t=localStorage.getItem("ci-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else if(t!=="auto")document.documentElement.setAttribute("data-theme","light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script><script>try{var a=localStorage.getItem("ci-accent");if(a&&a!=="indigo")document.documentElement.setAttribute("data-accent",a)}catch(e){}</script></head><body><div id="root"></div><script src="dist/main.js"></script></body></html>
